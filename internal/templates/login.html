<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>Login - CCTV Admin</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        min-height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f5f7fb;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #0f172a;
        }
      }

      .panel {
        width: min(380px, 90vw);
        background: #fff;
        border-radius: 12px;
        padding: 32px;
        box-shadow: 0 10px 40px rgba(15, 23, 42, 0.1);
      }

      @media (prefers-color-scheme: dark) {
        .panel {
          background: #1e293b;
          box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
      }

      h1 {
        margin: 0 0 12px;
        text-align: center;
        font-size: 1.5rem;
        color: #0f172a;
        font-weight: 600;
      }

      @media (prefers-color-scheme: dark) {
        h1 {
          color: #f1f5f9;
        }
      }

      p {
        margin: 0 0 24px;
        text-align: center;
        color: #475569;
        font-size: 0.95rem;
      }

      @media (prefers-color-scheme: dark) {
        p {
          color: #94a3b8;
        }
      }

      label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        color: #334155;
        margin-bottom: 6px;
      }

      @media (prefers-color-scheme: dark) {
        label {
          color: #cbd5e1;
        }
      }

      input {
        width: 100%;
        padding: 11px 14px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        font-size: 0.95rem;
        margin-bottom: 16px;
        transition: all 0.2s;
        background: #fff;
        color: #0f172a;
      }

      input:focus {
        outline: none;
        border-color: #0b5ed7;
        box-shadow: 0 0 0 3px rgba(11, 94, 215, 0.1);
      }

      @media (prefers-color-scheme: dark) {
        input {
          background: #334155;
          border-color: #475569;
          color: #f1f5f9;
        }

        input:focus {
          border-color: #3b82f6;
          box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
      }

      button {
        width: 100%;
        padding: 12px;
        background: #0b5ed7;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 8px;
      }

      button:hover:not(:disabled) {
        background: #0a58ca;
      }

      button:active:not(:disabled) {
        transform: scale(0.98);
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      @media (prefers-color-scheme: dark) {
        button {
          background: #3b82f6;
        }

        button:hover:not(:disabled) {
          background: #2563eb;
        }
      }

      .error {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fecaca;
        border-radius: 8px;
        padding: 12px 14px;
        font-size: 0.875rem;
        display: none;
        margin-bottom: 16px;
      }

      @media (prefers-color-scheme: dark) {
        .error {
          background: #7f1d1d;
          color: #fecaca;
          border-color: #991b1b;
        }
      }

      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        margin-right: 8px;
        vertical-align: middle;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Welcome Back</h1>
      <p>Use your administrator credentials to continue.</p>
      <div id="error" class="error" role="alert"></div>
      <form id="loginForm">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          required
          autocomplete="username"
          aria-describedby="error"
        />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          autocomplete="current-password"
          aria-describedby="error"
        />

        <button type="submit" id="submitBtn">
          <span id="btnText">Sign in</span>
        </button>
      </form>
    </div>

    <script>
      const form = document.getElementById("loginForm");
      const errorBox = document.getElementById("error");
      const submitBtn = document.getElementById("submitBtn");
      const btnText = document.getElementById("btnText");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        // Hide previous errors
        errorBox.style.display = "none";
        errorBox.textContent = "";

        // Disable button and show loading state
        submitBtn.disabled = true;
        btnText.innerHTML = '<span class="spinner"></span>Signing in...';

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        try {
          const res = await fetch("/api/login", {
            method: "POST",
            body: JSON.stringify({ username, password }),
            headers: {
              "Content-Type": "application/json",
              // Add CSRF token if using Django
              "X-CSRFToken": getCookie("csrftoken"),
            },
            credentials: "same-origin",
          });

          const data = await res.json().catch(() => ({}));

          if (res.ok) {
            btnText.textContent = "Success!";
            window.location.href = data.redirect || "/admin";
          } else {
            const message = data.error || "Invalid username or password.";
            showError(message);
          }
        } catch (err) {
          console.error("Login error:", err);
          showError(
            "Network error. Please check your connection and try again."
          );
        } finally {
          submitBtn.disabled = false;
          btnText.textContent = "Sign in";
        }
      });

      function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = "block";
        errorBox.setAttribute("role", "alert");
      }

      function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== "") {
          const cookies = document.cookie.split(";");
          for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === name + "=") {
              cookieValue = decodeURIComponent(
                cookie.substring(name.length + 1)
              );
              break;
            }
          }
        }
        return cookieValue;
      }
    </script>
  </body>
</html>
